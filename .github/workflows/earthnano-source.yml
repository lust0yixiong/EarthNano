name: EarthNano source shard

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      kind:
        required: true
        type: string
      shard:
        required: true
        type: number
      total:
        required: true
        type: number

permissions:
  contents: read

jobs:
  source:
    name: Source ${{ inputs.os }} ${{ inputs.kind }} ${{ inputs.shard }}/${{ inputs.total }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: python
        with: { python-version-file: .github/earthnano-python-version }
      - name: Original Linux native headers and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev libdbus-1-dev xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: runner.os == 'Windows'
        with:
          name: earthnano-windows-runtime
          path: packages/notebook-network-sandbox/vendor/windows-runtime/x64/
      - name: Full selected original source shard on exact pinned source
        env:
          EARTHNANO_RESEARCH_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          args=(node scripts/ci/earthnano-source.mjs source --kind '${{ inputs.kind }}' --shard '${{ inputs.shard }}' --total '${{ inputs.total }}' --out "$RUNNER_TEMP/source-report")
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a "${args[@]}"; else "${args[@]}"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-source-${{ inputs.os }}-${{ inputs.kind }}-${{ inputs.shard }}
          path: ${{ runner.temp }}/source-report/
          retention-days: 14
          if-no-files-found: error
