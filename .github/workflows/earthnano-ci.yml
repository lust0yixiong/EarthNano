name: EarthNano CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ci/earthnano-native]
  workflow_dispatch:
    inputs:
      native:
        description: Build unsigned native packages and execute original launch/resource smoke (required before Alpha acceptance)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: earthnano-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve original platform sharding
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref != 'refs/heads/ci/earthnano-native'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const include = []
          for (const [os, total] of [['ubuntu-24.04', 4], ['macos-15', 4], ['windows-2022', 8]])
            for (const kind of ['baseline', 'candidate'])
              for (let shard = 1; shard <= total; shard++) include.push({os, kind, shard, total})
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\n`)

  windows_runtime:
    name: Original pinned Windows Notebook runtime
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/windows-notebook-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-windows-runtime
          path: packages/notebook-network-sandbox/vendor/windows-runtime/x64/
          retention-days: 3
          if-no-files-found: error

  source:
    name: Source ${{ matrix.os }} ${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: [plan, windows_runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: python
        with: { python-version: '3.12.13' }
      - name: Original Linux native headers and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev libdbus-1-dev xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: runner.os == 'Windows'
        with:
          name: earthnano-windows-runtime
          path: packages/notebook-network-sandbox/vendor/windows-runtime/x64/
      - name: Full selected original source shard on exact pinned source
        env:
          EARTHNANO_RESEARCH_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          args=(node scripts/ci/earthnano-source.mjs source --kind '${{ matrix.kind }}' --shard '${{ matrix.shard }}' --total '${{ matrix.total }}' --out "$RUNNER_TEMP/source-report")
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a "${args[@]}"; else "${args[@]}"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-source-${{ matrix.os }}-${{ matrix.kind }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/source-report/
          retention-days: 14
          if-no-files-found: error

  comparison:
    name: Enforce pinned original source comparison
    needs: source
    if: always() && needs.source.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { pattern: earthnano-source-*, path: source-reports }
      - run: node scripts/ci/earthnano-source.mjs compare --reports source-reports --out test-results/earthnano-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-source-comparison
          path: test-results/earthnano-ci/
          retention-days: 14
          if-no-files-found: error

  harness:
    name: Pinned Harness source and original unittest comparison (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref != 'refs/heads/ci/earthnano-native'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24 }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: '3.12.13' }
      - name: Fetch exact original Harness source (no model packages)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/google-research/harness2.git "$RUNNER_TEMP/harness-original"
          git -C "$RUNNER_TEMP/harness-original" checkout --detach 1cfe254e8d25b15f37048c3730134686abe60335
          test "$(git -C "$RUNNER_TEMP/harness-original" rev-parse 'HEAD^{tree}')" = edc756a4d03a2826a248115482084a176e60e751
          cmp "$RUNNER_TEMP/harness-original/LICENSE" vendor/harness2/LICENSE
      - name: Execute original and integrated tests with identical Python
        run: |
          python scripts/ci/earthnano-harness.py "$RUNNER_TEMP/harness-original" test-results/harness-baseline.json --kind baseline
          python scripts/ci/earthnano-harness.py vendor/harness2 test-results/harness-candidate.json --kind candidate
          node scripts/ci/earthnano-harness-compare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-harness-comparison
          path: test-results/harness-*.json
          retention-days: 14
          if-no-files-found: error

  native:
    name: Unsigned native build and original launch ${{ matrix.os }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.native) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ci/earthnano-native')
    needs: windows_runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, platform: mac, arch: arm64, subdir: osx-arm64 }
          - { os: macos-26-intel, platform: mac, arch: x64, subdir: osx-64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64, subdir: linux-64 }
          - { os: windows-2022, platform: win, arch: x64, subdir: win-64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: '3.12.13' }
      - name: Require original Icon Composer compiler
        if: runner.os == 'macOS'
        run: xcrun actool --version
      - name: Original Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev libdbus-1-dev xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: runner.os == 'Windows'
        with:
          name: earthnano-windows-runtime
          path: packages/notebook-network-sandbox/vendor/windows-runtime/x64/
      - name: Install original dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Require exact lockfile Electron binary
        run: node scripts/ci/earthnano-source.mjs electron
      - name: Stage original pinned resources
        shell: bash
        run: |
          name=micromamba
          [[ '${{ matrix.platform }}' == win ]] && name=micromamba.exe
          node scripts/fetch-micromamba.mjs '${{ matrix.subdir }}' 'resources/bin/${{ matrix.platform }}/${{ matrix.arch }}/'"$name"
          if [[ '${{ matrix.platform }}' == win ]]; then node scripts/fetch-micromamba.mjs win-64 'resources/bin/win/x64/micromamba-compat.exe' compatibility; fi
      - name: Original full application build
        run: npm run build
      - name: Original target Prisma engine pruning
        shell: bash
        run: |
          case '${{ matrix.platform }}-${{ matrix.arch }}' in
            mac-arm64) keep=darwin-arm64 ;;
            mac-x64) keep=darwin.dylib ;;
            linux-x64) keep='openssl-3.0.x.so.node' ;;
            win-x64) keep=query_engine-windows.dll.node ;;
            *) exit 1 ;;
          esac
          found=0
          for file in node_modules/.prisma/client/*query_engine-*; do
            [[ -e "$file" ]] || continue
            if [[ "$file" == *"$keep"* ]]; then found=1; else rm "$file"; fi
          done
          [[ "$found" == 1 ]]
      - name: Native unsigned packaging (never publish)
        shell: bash
        run: |
          args=(--'${{ matrix.platform }}' --'${{ matrix.arch }}' --publish never)
          if [[ '${{ matrix.platform }}' == mac ]]; then args+=(-c.mac.identity=null -c.dmg.sign=false); fi
          node node_modules/electron-builder/cli.js "${args[@]}"
      - name: Original macOS DMG/ZIP resource, catalog/fallback and launch smoke
        if: runner.os == 'macOS'
        run: node scripts/macos-package-smoke.mjs --artifact-dir dist
      - name: Original Windows installed resource, RPC and launch smoke
        if: runner.os == 'Windows'
        run: node scripts/windows-installer-smoke.mjs --installer-dir dist
      - name: Original Linux DEB lifecycle, AppImage resources and installed launch smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          trap 'sudo apt-get remove --yes open-science || true' EXIT
          sudo "$(command -v node)" scripts/deb-package-lifecycle-smoke.mjs ./dist/*.deb
          sudo apt-get install --yes ./dist/*.deb
          product="$(node -p "require('./package.json').productName")"
          xvfb-run -a node scripts/linux-package-smoke.mjs --artifact-dir dist --installed-executable "/opt/$product/open-science" --installed-cli /usr/bin/open-science
      - name: Retain validated unsigned packages (CI artifacts, no release publication)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-unsigned-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          retention-days: 3
          if-no-files-found: error
      - name: Source identity, license and streamed artifact digests
        if: always()
        run: node scripts/ci/earthnano-source.mjs manifest --out test-results/native-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-native-evidence-${{ matrix.os }}
          path: |
            test-results/native-evidence/
            dist/*certification*.json
            dist/*builder*.yml
          retention-days: 14
          if-no-files-found: error
