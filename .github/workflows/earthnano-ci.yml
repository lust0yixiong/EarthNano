name: EarthNano CI
run-name: EarthNano packaged QA - ${{ inputs.mode }} - ${{ inputs.target }}

# Operational branch only: replace this existing workflow path, not the default branch.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing validated macOS package to exercise
        type: choice
        options: [macos-26-intel, macos-26]
        default: macos-26-intel
      mode:
        description: Science acceptance or read-only Keychain context diagnosis
        type: choice
        options: [science, keychain-context-diagnostic]
        default: science

permissions:
  contents: read
  actions: read

concurrency:
  group: earthnano-packaged-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packaged-science:
    name: ${{ inputs.mode == 'keychain-context-diagnostic' && 'Keychain context diagnostic (no science acceptance)' || 'Packaged same-task science acceptance' }}
    if: github.ref == 'refs/heads/ci/earthnano-packaged-qa'
    runs-on: ${{ inputs.target == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 60
    env:
      QA_SOURCE_ROOT: ${{ github.workspace }}/qa-source
      QA_OPERATION_SHA: ${{ github.sha }}
      QA_WORKFLOW_REF: ${{ github.workflow_ref }}
      QA_MAC_TARGET: ${{ inputs.target }}
    steps:
      - name: Allocate owned QA paths
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_TEMP" = /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]] || exit 1
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          printf 'QA_ROOT=%s\n' "$RUNNER_TEMP/earthnano-packaged-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout exact operational instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: qa-operation
          persist-credentials: false
      - name: Checkout immutable application source and original test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 4a31b9ae72654cf6ddf7749103abb48b5f85043f
          path: qa-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: qa-source/.github/earthnano-node-version
          cache: npm
          cache-dependency-path: qa-source/package-lock.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: qa-source/.github/earthnano-python-version
      - name: Require same-source identity and successful selected macOS job; archive release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$QA_ROOT/evidence" "$QA_ROOT/tmp" "$QA_ROOT/runner-home"
          gh run view 39629283517 -R lust0yixiong/EarthNano --json databaseId,headSha,workflowName,status,conclusion,jobs > "$QA_ROOT/evidence/native-run.json"
          gh run view 39629363410 -R lust0yixiong/EarthNano --json databaseId,headSha,workflowName,status,conclusion,jobs > "$QA_ROOT/evidence/source-run.json"
          node qa-operation/scripts/ci/packaged-qa/prepare.mjs verify-runs
      - name: Original isolated-runner dependency preparation (no application rebuild)
        working-directory: qa-source
        run: node scripts/ci/npm-ci.mjs
      - name: Explicit pinned test-only Claude CLI preparation
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/earthnano-qa-runtime"
          test ! -e "$prefix"
          npm install --no-audit --no-fund --prefix "$prefix" @anthropic-ai/claude-code@2.1.232
          "$prefix/node_modules/.bin/claude" --version > "$QA_ROOT/evidence/claude-version.txt"
          node --input-type=module - "$QA_ROOT/evidence/claude-version.txt" <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          assert.match(readFileSync(process.argv[2], 'utf8').trim(), /^2\.1\.232(?: \(Claude Code\))?$/)
          NODE
          cp "$prefix/package-lock.json" "$QA_ROOT/evidence/claude-runtime-package-lock.json"
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Download original final selected macOS package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: lust0yixiong/EarthNano
          run-id: 39629283517
          name: earthnano-unsigned-${{ inputs.target }}
          path: ${{ env.QA_ROOT }}/packages
      - name: Download original final selected macOS native evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: lust0yixiong/EarthNano
          run-id: 39629283517
          name: earthnano-native-evidence-${{ inputs.target }}
          path: ${{ env.QA_ROOT }}/native-evidence
      - name: Verify exact source and real bytes; project diagnostic paths only
        run: node qa-operation/scripts/ci/packaged-qa/prepare.mjs prepare
      - name: Original packaged Keychain wrapper and offline same-Task explicit resume
        if: inputs.mode == 'science'
        run: bash qa-operation/scripts/ci/packaged-qa/run.sh
      - name: Diagnostic only - original packaged Keychain metadata contexts
        if: inputs.mode == 'keychain-context-diagnostic'
        run: node qa-operation/scripts/ci/packaged-qa/keychain-context-diagnostic.mjs
      - name: Retain original failed or successful acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.mode == 'keychain-context-diagnostic' && 'earthnano-keychain-context' || 'earthnano-packaged-science' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QA_ROOT }}/evidence/
            ${{ env.QA_ROOT }}/results/
            ${{ env.QA_ROOT }}/generated/*.ts
            ${{ env.QA_ROOT }}/packaged.playwright.config.ts
            ${{ env.QA_ROOT }}/native-evidence/
          retention-days: 14
          if-no-files-found: error
