name: EarthNano Windows focused regression checks

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused:
    name: Focused original Windows regression tests (not full source acceptance)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: 0a1a1ac9365e0cdf40790503582adae5b98c0f0a, fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version-file: .github/earthnano-node-version, cache: npm }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        id: python
        with: { python-version-file: .github/earthnano-python-version }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: earthnano-windows-runtime
          run-id: 39700451549
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/notebook-network-sandbox/vendor/windows-runtime/x64/
      - name: Original dependency installation
        run: node scripts/ci/npm-ci.mjs
      - name: Require original pinned Electron
        run: node scripts/ci/earthnano-source.mjs electron
      - name: Original pretest
        run: npm run pretest
      - name: Selected original regression tests
        shell: bash
        env:
          EARTHNANO_RESEARCH_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 \
            scripts/ci/audit-module-ownership.test.ts \
            scripts/ci/earthnano-ci.test.ts \
            scripts/ci/earthnano-ci-topology.test.ts \
            scripts/ci/module-consumer-coverage.test.ts \
            src/main/host-layer-dependencies.architecture.test.ts \
            src/renderer/src/i18n/resources.test.ts \
            src/shared/earthnano/release-identity.test.ts \
            scripts/alpha-release-feed.test.ts \
            src/main/acp/claude-candidate-preparation.test.ts \
            src/main/session-package/browser-import.test.ts \
            src/main/managed-file-versions/version-file-operator.test.ts \
            src/main/earthnano/optimization-reconciliation.test.ts \
            src/main/earthnano/persistent-candidate-owner.binary.test.ts \
            src/main/earthnano/harness-optimization.test.ts \
            src/main/composition/desktop-optimization.test.ts \
            src/main/credential-identity/sqlite-snapshot.test.ts \
            src/main/earthnano/desktop-optimization-manager.test.ts \
            src/main/earthnano/execution-core.test.ts \
            src/main/earthnano/execution-store.test.ts \
            src/main/earthnano/candidate-snapshot.test.ts \
            src/main/earthnano/optimization-failure-diagnostics.test.ts \
            src/main/earthnano/optimization-resume.test.ts \
            packages/durable-files/src/file-durability.test.ts \
            --reporter=json --outputFile=test-results/windows-focused/vitest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: earthnano-windows-focused-regressions
          path: test-results/windows-focused/
          retention-days: 14
          if-no-files-found: error
