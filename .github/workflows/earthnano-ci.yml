name: EarthNano CI

on:
  pull_request:
    branches: [main, feat/alpha-*]
  push:
    branches: [main, ci/earthnano-native]
  workflow_dispatch:
    inputs:
      native:
        description: Build unsigned native packages and execute original launch/resource smoke (required before Alpha acceptance)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: earthnano-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve original platform sharding
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref != 'refs/heads/ci/earthnano-native'
    outputs:
      unix_matrix: ${{ steps.matrix.outputs.unix_matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
    steps:
      - id: matrix
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const include = [{os: 'ubuntu-24.04', kind: 'cohort', shard: 1, total: 4, batch: true}]
          for (const [os, total] of [['macos-15', 4], ['windows-2022', 8]])
            for (const kind of ['baseline', 'candidate'])
              for (let shard = 1; shard <= total; shard++) include.push({os, kind, shard, total, batch: false})
          for (const [name, windows] of [['unix_matrix', false], ['windows_matrix', true]])
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${JSON.stringify({include: include.filter(row => row.os.startsWith('windows-') === windows)})}\n`)

  windows_runtime:
    name: Original pinned Windows Notebook runtime
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .github/earthnano-node-version }
      - uses: ./.github/actions/windows-notebook-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-windows-runtime
          path: packages/notebook-network-sandbox/vendor/windows-runtime/x64/
          retention-days: 3
          if-no-files-found: error

  source_unix:
    name: Source ${{ matrix.os }} ${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unix_matrix) }}
    uses: ./.github/workflows/earthnano-source.yml
    with:
      os: ${{ matrix.os }}
      kind: ${{ matrix.kind }}
      shard: ${{ matrix.shard }}
      total: ${{ matrix.total }}
      batch: ${{ matrix.batch }}

  source_windows:
    name: Source ${{ matrix.os }} ${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: [plan, windows_runtime]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    uses: ./.github/workflows/earthnano-source.yml
    with:
      os: ${{ matrix.os }}
      kind: ${{ matrix.kind }}
      shard: ${{ matrix.shard }}
      total: ${{ matrix.total }}
      batch: ${{ matrix.batch }}

  comparison:
    name: Enforce pinned original source comparison
    needs: [source_unix, source_windows]
    if: always() && github.ref != 'refs/heads/ci/earthnano-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .github/earthnano-node-version }
      - name: Require both complete source matrices
        shell: node {0}
        env:
          SOURCE_UNIX_RESULT: ${{ needs.source_unix.result }}
          SOURCE_WINDOWS_RESULT: ${{ needs.source_windows.result }}
        run: |
          for (const key of ['SOURCE_UNIX_RESULT', 'SOURCE_WINDOWS_RESULT'])
            if (process.env[key] !== 'success') throw new Error(`Required source matrix did not succeed: ${key}`)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { pattern: earthnano-source-*, path: source-reports }
      - run: node scripts/ci/earthnano-source.mjs compare --reports source-reports --out test-results/earthnano-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-source-comparison
          path: test-results/earthnano-ci/
          retention-days: 14
          if-no-files-found: error

  harness:
    name: Pinned Harness source and original unittest comparison (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref != 'refs/heads/ci/earthnano-native'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .github/earthnano-node-version }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version-file: .github/earthnano-python-version }
      - name: Fetch exact original Harness source (no model packages)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/google-research/harness2.git "$RUNNER_TEMP/harness-original"
          git -C "$RUNNER_TEMP/harness-original" checkout --detach 1cfe254e8d25b15f37048c3730134686abe60335
          test "$(git -C "$RUNNER_TEMP/harness-original" rev-parse 'HEAD^{tree}')" = edc756a4d03a2826a248115482084a176e60e751
          cmp "$RUNNER_TEMP/harness-original/LICENSE" vendor/harness2/LICENSE
      - name: Execute original and integrated tests with identical Python
        run: |
          python scripts/ci/earthnano-harness.py "$RUNNER_TEMP/harness-original" test-results/harness-baseline.json --kind baseline
          python scripts/ci/earthnano-harness.py vendor/harness2 test-results/harness-candidate.json --kind candidate
          node scripts/ci/earthnano-harness-compare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-harness-comparison
          path: test-results/harness-*.json
          retention-days: 14
          if-no-files-found: error

  native_unix:
    name: Unsigned native build and original launch ${{ matrix.os }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.native) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ci/earthnano-native')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, platform: mac, arch: arm64, subdir: osx-arm64 }
          - { os: macos-26-intel, platform: mac, arch: x64, subdir: osx-64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64, subdir: linux-64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, subdir: linux-aarch64 }
    uses: ./.github/workflows/earthnano-native.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      subdir: ${{ matrix.subdir }}

  native_windows:
    name: Unsigned native build and original launch ${{ matrix.os }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.native) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ci/earthnano-native')
    needs: windows_runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: win, arch: x64, subdir: win-64 }
    uses: ./.github/workflows/earthnano-native.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      subdir: ${{ matrix.subdir }}
