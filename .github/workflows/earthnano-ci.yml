name: EarthNano CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    name: Original Windows PowerShell publication regression
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version-file: .github/earthnano-node-version, cache: npm }
      - name: Locked test-only JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original PowerShell publication fixtures
        run: node node_modules/vitest/vitest.mjs run --project=default --maxWorkers=2 scripts/windows-install-publication.test.ts --reporter=json --outputFile=test-results/windows-publication/vitest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: earthnano-windows-publication-regression
          path: |
            test-results/windows-publication/
            tmp/install-publication-tests/case-*/*.json
          retention-days: 14
          if-no-files-found: error
