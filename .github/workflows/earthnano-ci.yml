name: EarthNano 0.1.1 isolated live acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: earthnano-0.1.1-isolated-live-acceptance
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/ci/earthnano-0.1.1-live-check' && github.repository == 'lust0yixiong/EarthNano' && github.actor == 'lust0yixiong'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8829c1596f55449267945716e8d47f3714935144
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .github/earthnano-node-version, cache: npm }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version-file: .github/earthnano-python-version }
      - name: Prepare original test dependencies without building the application
        run: node scripts/ci/npm-ci.mjs
      - name: Prepare the existing pinned test-only Claude Code runtime
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/earthnano-trial-claude"
          npm install --no-audit --no-fund --prefix "$prefix" @anthropic-ai/claude-code@2.1.232
          "$prefix/node_modules/.bin/claude" --version
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39715941943
          name: earthnano-unsigned-macos-26
          path: trial-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39715941943
          name: earthnano-native-evidence-macos-26
          path: native-evidence
      - name: Verify source identity and actual existing package bytes, then extract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8829c1596f55449267945716e8d47f3714935144
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFile,writeFile,stat} from 'node:fs/promises'
          import {createReadStream} from 'node:fs'
          import {createHash} from 'node:crypto'
          const manifest=JSON.parse(await readFile('native-evidence/test-results/native-evidence/artifact-manifest.json','utf8'))
          assert.equal(manifest.source,'8829c1596f55449267945716e8d47f3714935144')
          assert.equal(manifest.sourceDirty,false)
          assert.equal(manifest.version,'0.1.1-alpha.1')
          assert.equal(manifest.platform,'darwin')
          assert.equal(manifest.arch,'arm64')
          const name='EarthNano-0.1.1-alpha.1-mac-arm64.zip'
          const record=manifest.files.find(file=>file.path==='dist/'+name)
          assert(record)
          const path='trial-package/'+name, hash=createHash('sha256')
          for await(const chunk of createReadStream(path)) hash.update(chunk)
          const sha256=hash.digest('hex')
          assert.equal(record.bytes,(await stat(path)).size)
          assert.equal(sha256,record.sha256)
          assert.equal(sha256,'f61100b36939831500bc703099946165fb905c4085284bd61e6b624619c7a293')
          await writeFile('live-package-proof.json',JSON.stringify({verified:true,source:manifest.source,sourceRunId:39715941943,name,sha256},null,2)+'\n')
          NODE
          ditto -x -k trial-package/EarthNano-0.1.1-alpha.1-mac-arm64.zip "$RUNNER_TEMP/earthnano-trial-app"
          app="$RUNNER_TEMP/earthnano-trial-app/EarthNano.app"
          test -x "$app/Contents/MacOS/EarthNano"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.1.1-alpha.1
          echo "OPEN_SCIENCE_E2E_EXECUTABLE=$app/Contents/MacOS/EarthNano" >> "$GITHUB_ENV"
      - name: Stage only the explicitly authorized temporary test credential
        env:
          TEST_DEEPSEEK_KEY: ${{ secrets.EARTHNANO_0_1_1_DEEPSEEK_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {writeFile,appendFile} from 'node:fs/promises'
          import {join} from 'node:path'
          const key=process.env.TEST_DEEPSEEK_KEY
          assert(key && /^sk-[A-Za-z0-9]+$/.test(key),'Explicit test credential is required')
          const path=join(process.env.RUNNER_TEMP,'earthnano-live-deepseek.key')
          await writeFile(path,key,{mode:0o600,flag:'wx'})
          await appendFile(process.env.GITHUB_ENV,'EARTHNANO_LIVE_DEEPSEEK_KEY_FILE='+path+'\n')
          NODE
      - name: Unchanged original two-case live test, isolated HOME/Keychain, real Notebook and Reviews
        env:
          OPEN_SCIENCE_E2E_ISOLATE_HOME: '1'
          EARTHNANO_LIVE_DEEPSEEK: '1'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-macos-packaged-e2e.sh \
            node node_modules/@playwright/test/cli.js test e2e/earthnano-upstream-trials.spec.ts \
              --workers=1 --retries=0 --trace=on
      - name: Require actual live results and independent passing assessments
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readdir,readFile,writeFile} from 'node:fs/promises'
          import {join} from 'node:path'
          const reports=[]
          async function walk(root){for(const entry of await readdir(root,{withFileTypes:true})){const path=join(root,entry.name);if(entry.isDirectory())await walk(path);else if(entry.name==='upstream-trial.json')reports.push(JSON.parse(await readFile(path,'utf8')))}}
          await walk('test-results')
          assert.deepEqual(reports.map(r=>r.trial).sort(),['harness2-ledger','openscience-case16'])
          for(const report of reports){
            assert.equal(report.status,'passed')
            assert.equal(report.live,true)
            assert(report.notebookRuns.some(run=>run.status==='completed'))
            assert.equal(report.provider.rejected,0)
            assert.equal(report.provider.usage.incompleteRequests,0)
            assert(report.provider.upstreamRequests>0 && report.provider.upstreamRequests<=160)
            assert.deepEqual(report.provider.upstreamStatuses,{'200':report.provider.upstreamRequests})
          }
          const scientific=reports.find(r=>r.trial==='openscience-case16')
          assert.deepEqual(scientific.artifacts.map(({name,sha256})=>({name,sha256})),[
            {name:'trial_calculations.csv',sha256:'ce5be45173e72f859c525876424d87eacd4a9c88d79afce550fbf3232e719da6'},
            {name:'availability_summary.csv',sha256:'64e40cf520346dd84f3e07310314b3b7a8e5ce44929aa9963967b23e42c8721e'}
          ])
          const optimization=reports.find(r=>r.trial==='harness2-ledger').optimization
          assert.equal(optimization.state,'completed')
          const tasks=optimization.sweep.domains.flatMap(d=>d.summary.tasks)
          assert.equal(tasks.length,1)
          assert.equal(tasks[0].assessments.baseline.outcome,'pass')
          assert.equal(tasks[0].assessments.candidate.outcome,'pass')
          assert.equal(tasks[0].outcome.artifact.status,'passed')
          await writeFile('live-acceptance-summary.json',JSON.stringify({verified:true,source:'8829c1596f55449267945716e8d47f3714935144',packageSha256:'f61100b36939831500bc703099946165fb905c4085284bd61e6b624619c7a293',totalUpstreamRequests:reports.reduce((sum,r)=>sum+r.provider.upstreamRequests,0),trials:reports.map(({trial,provider})=>({trial,requests:provider.upstreamRequests,roles:provider.roles})),independentOutcomes:'baseline and candidate pass; deterministic artifact passed; both original graceful restart gates passed'},null,2)+'\n')
          NODE
      - name: Remove the runner's plaintext test key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/earthnano-live-deepseek.key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-0.1.1-isolated-live-evidence
          path: |
            live-package-proof.json
            live-acceptance-summary.json
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error
