name: EarthNano Windows original installer verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    name: Reuse exact original validated Windows runtime artifact
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: earthnano-windows-runtime
          run-id: 39700451549
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-windows-runtime
          path: runtime/
          retention-days: 3
          if-no-files-found: error
  native:
    name: Original Windows installed application acceptance
    needs: runtime
    uses: ./.github/workflows/earthnano-native.yml
    with:
      os: windows-2022
      platform: win
      arch: x64
      subdir: win-64
