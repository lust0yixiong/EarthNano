name: EarthNano CI

# Temporary operational branch only. No release/tag writes and no automatic triggers.
on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: Actual completed successful packaged-science QA run ID (required; no placeholder)
        required: true
        type: string
      qa_operational_sha:
        description: Full approved operational commit SHA of that QA run, separate from application4a31
        required: true
        type: string
      notes:
        description: Reviewed Alpha release notes; metadata preparation does not publish them
        required: true
        type: string
        default: Unsigned 0.1-Alpha preview for macOS and Linux. Windows is deferred to 0.2-Alpha. These packages are not Developer ID signed or notarized.

permissions:
  contents: read
  actions: read

concurrency:
  group: earthnano-alpha-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-alpha-assets:
    if: github.ref == 'refs/heads/ci/earthnano-alpha-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ALPHA_SOURCE_ROOT: ${{ github.workspace }}/alpha-source
      ALPHA_OPERATION_SHA: ${{ github.sha }}
      ALPHA_QA_RUN_ID: ${{ inputs.qa_run_id }}
      ALPHA_QA_OPERATIONAL_SHA: ${{ inputs.qa_operational_sha }}
    steps:
      - name: Initialize isolated asset preparation root
        run: |
          set -euo pipefail
          [[ -n "$RUNNER_TEMP" && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          alpha_root="$RUNNER_TEMP/earthnano-alpha-assets-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$alpha_root" == "$RUNNER_TEMP"/earthnano-alpha-assets-* && "$alpha_root" != *$'\n'* && "$alpha_root" != *$'\r'* ]] || exit 1
          printf 'ALPHA_ROOT=%s\n' "$alpha_root" >> "$GITHUB_ENV"
      - name: Checkout exact operational instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: alpha-operation
          persist-credentials: false
      - name: Checkout fixed application release helpers (not an application rebuild)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 4a31b9ae72654cf6ddf7749103abb48b5f85043f
          path: alpha-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: alpha-source/.github/earthnano-node-version
      - name: Require real native, source and QA completion before downloading packages
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ALPHA_QA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ALPHA_QA_OPERATIONAL_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$ALPHA_ROOT/evidence"
          gh run view 39629283517 -R lust0yixiong/EarthNano --json databaseId,headSha,workflowName,status,conclusion,jobs > "$ALPHA_ROOT/evidence/native-run.json"
          gh run view 39629363410 -R lust0yixiong/EarthNano --json databaseId,headSha,workflowName,status,conclusion,jobs > "$ALPHA_ROOT/evidence/source-run.json"
          gh run view "$ALPHA_QA_RUN_ID" -R lust0yixiong/EarthNano --json databaseId,headSha,headBranch,workflowName,status,conclusion,attempt,jobs > "$ALPHA_ROOT/evidence/qa-run.json"
          node alpha-operation/scripts/ci/alpha-assets/prepare-assets.mjs verify-runs 2>&1 | tee "$ALPHA_ROOT/evidence/verify-runs.log"
      - name: Original release transform dependencies, without lifecycle scripts or application build
        working-directory: alpha-source
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund
      - name: Download same-run four original Unix package artifacts, keeping Mac feeds separate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: lust0yixiong/EarthNano
          run-id: 39629283517
          pattern: earthnano-unsigned-*
          path: ${{ env.ALPHA_ROOT }}/inputs/packages
      - name: Download same-run four original Unix native evidence artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: lust0yixiong/EarthNano
          run-id: 39629283517
          pattern: earthnano-native-evidence-*
          path: ${{ env.ALPHA_ROOT }}/inputs/native
      - name: Download original source comparison outcome
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: lust0yixiong/EarthNano
          run-id: 39629363410
          name: earthnano-source-comparison
          path: ${{ env.ALPHA_ROOT }}/evidence/source-comparison
      - name: Download exact successful QA attempt evidence, never an arbitrary prior attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: lust0yixiong/EarthNano
          run-id: ${{ inputs.qa_run_id }}
          name: ${{ steps.runs.outputs.qa_artifact }}
          path: ${{ env.ALPHA_ROOT }}/inputs/qa
      - name: Verify actual source, bytes, original certifications and QA; stage without overwrites
        run: |
          set -euo pipefail
          node alpha-operation/scripts/ci/alpha-assets/prepare-assets.mjs collect 2>&1 | tee "$ALPHA_ROOT/evidence/collect.log"
      - name: Original Unix certification aggregate
        working-directory: alpha-source
        run: |
          set -euo pipefail
          node scripts/ci/release-certification-evidence.mjs aggregate \
            --directory "$ALPHA_ROOT/assets" \
            --output "$ALPHA_ROOT/assets/RELEASE-CERTIFICATION.json" \
            --expected-sha 4a31b9ae72654cf6ddf7749103abb48b5f85043f \
            --platforms mac,linux 2>&1 | tee "$ALPHA_ROOT/evidence/aggregate.log"
      - name: Original mac feed merge for the explicit Alpha channel
        working-directory: alpha-source
        run: |
          set -euo pipefail
          node scripts/merge-mac-feed.mjs "$ALPHA_ROOT/assets" --channel alpha 2>&1 | tee "$ALPHA_ROOT/evidence/merge-mac-feed.log"
      - name: Original real-byte SHA256SUMS recipe
        run: |
          set -euo pipefail
          cd "$ALPHA_ROOT/assets"
          shopt -s nullglob
          files=(*.dmg *.zip *.AppImage *.deb)
          [[ ${#files[@]} -eq 8 ]]
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt 2>&1 | tee "$ALPHA_ROOT/evidence/checksums.log"
      - name: Original complete Alpha manifest generator with explicit Unix scope
        working-directory: alpha-source
        env:
          VERSION: 0.1.0-alpha.1
          UPDATE_CHANNEL: alpha
          ASSET_BASE_URL: https://github.com/lust0yixiong/EarthNano/releases/download/v0.1.0-alpha.1
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          export RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/generate-version-manifest.mjs "$ALPHA_ROOT/assets" "$ALPHA_ROOT/assets/version.json" --require-complete --platforms mac,linux 2>&1 | tee "$ALPHA_ROOT/evidence/manifest.log"
          printf '%s\n' "$RELEASE_DATE" > "$ALPHA_ROOT/evidence/asset-preparation-time.txt"
      - name: Upload prepared Alpha assets as an Actions artifact only (no publication)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-alpha-prepared-4a31-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ALPHA_ROOT }}/assets/
            ${{ env.ALPHA_ROOT }}/evidence/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Preserve raw gate and helper failures independently of the prepared asset
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-alpha-prepare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ALPHA_ROOT }}/evidence/
            ${{ env.ALPHA_ROOT }}/inputs/native/
            ${{ env.ALPHA_ROOT }}/inputs/qa/evidence/
          retention-days: 14
          if-no-files-found: error
