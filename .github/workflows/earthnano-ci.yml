# Temporary operation branch only; never merge this workflow/helper into the product.
name: EarthNano 0.2 Alpha draft preparation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed, merged version source (must beca96faed10916edde870aae47da6d70f31e55300)
        required: true
        default: ca96faed10916edde870aae47da6d70f31e55300
        type: string
      windows_run_id:
        description: Completed successful same-ca96 Windows native run on ci/earthnano-native
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: earthnano-0.2-alpha-publication-operation
  cancel-in-progress: false

env:
  ALPHA_SOURCE_ROOT: ${{ github.workspace }}/application
  ALPHA_OPERATION_ROOT: ${{ github.workspace }}/operation/scripts/ci/alpha-02-publication
  ALPHA_ROOT: ${{ github.workspace }}/alpha-stage
  ALPHA_SOURCE_SHA: ${{ inputs.source_sha }}
  ALPHA_WINDOWS_RUN: ${{ inputs.windows_run_id }}

jobs:
  prepare:
    if: github.repository == 'lust0yixiong/EarthNano' && github.ref == 'refs/heads/ci/earthnano-0.2-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: operation, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: application/.github/earthnano-node-version }
      - name: Require both merged PRs, complete original CI, all five actual native jobs, preserved old releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node "$ALPHA_OPERATION_ROOT/prepare-alpha-release.mjs" gates
      - name: Original release helper dependencies only; actual application gates ran in original native CI
        working-directory: application
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund
      # Never mix PR28/PR29 or replace their16 original reports with focused reruns.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39734082630
          pattern: earthnano-source-*
          path: ${{ env.ALPHA_ROOT }}/inputs/source-39734082630/downloaded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39734082630
          name: earthnano-harness-comparison
          path: ${{ env.ALPHA_ROOT }}/inputs/source-39734082630/harness
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39744881823
          pattern: earthnano-source-*
          path: ${{ env.ALPHA_ROOT }}/inputs/source-39744881823/downloaded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39744881823
          name: earthnano-harness-comparison
          path: ${{ env.ALPHA_ROOT }}/inputs/source-39744881823/harness
      - name: Place raw source reports and original comparison in separate paths, without editing bytes
        shell: bash
        run: |
          set -euo pipefail
          for run in 39734082630 39744881823; do
            root="$ALPHA_ROOT/inputs/source-$run"
            mkdir "$root/reports"
            mv "$root/downloaded/earthnano-source-comparison" "$root/comparison"
            for directory in "$root/downloaded"/earthnano-source-*; do
              test -d "$directory"
              mv "$directory" "$root/reports/"
            done
            rmdir "$root/downloaded"
          done
      - name: Replay unchanged full Darwin/Linux16-report and Harness comparers for each original run
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node "$ALPHA_OPERATION_ROOT/prepare-alpha-release.mjs" compare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39746583897
          pattern: earthnano-unsigned-*
          path: ${{ env.ALPHA_ROOT }}/inputs/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 39746583897
          pattern: earthnano-native-evidence-*
          path: ${{ env.ALPHA_ROOT }}/inputs/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_run_id }}
          name: earthnano-unsigned-windows-2022
          path: ${{ env.ALPHA_ROOT }}/inputs/packages/earthnano-unsigned-windows-2022
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_run_id }}
          name: earthnano-native-evidence-windows-2022
          path: ${{ env.ALPHA_ROOT }}/inputs/native/earthnano-native-evidence-windows-2022
      - name: Hash all nine actual installers, every feed/blockmap and original certificates against clean-source manifests, then hardlink
        run: node "$ALPHA_OPERATION_ROOT/prepare-alpha-release.mjs" collect
      - name: Original five-target certification aggregate and byte-verified Mac feed merge
        working-directory: application
        run: |
          node scripts/ci/release-certification-evidence.mjs aggregate \
            --directory "$ALPHA_ROOT/assets" --output "$ALPHA_ROOT/assets/RELEASE-CERTIFICATION.json" \
            --expected-sha "$ALPHA_SOURCE_SHA" --platforms mac,linux,win
          node scripts/merge-mac-feed.mjs "$ALPHA_ROOT/assets" --channel alpha
          (cd "$ALPHA_ROOT/assets" && sha256sum --check --strict SHA256SUMS.txt)
      - name: Original complete Alpha manifest, verifying actual installers and all four platform feeds
        working-directory: application
        env:
          VERSION: 0.2.0-alpha.1
          UPDATE_CHANNEL: alpha
          ASSET_BASE_URL: https://github.com/lust0yixiong/EarthNano/releases/download/v0.2.0-alpha.1
        run: |
          export NOTES="$(cat "$ALPHA_OPERATION_ROOT/release-notes.md")"
          export RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/generate-version-manifest.mjs "$ALPHA_ROOT/assets" "$ALPHA_ROOT/assets/version.json" --require-complete --platforms mac,linux,win
          node "$ALPHA_OPERATION_ROOT/prepare-alpha-release.mjs" finalize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-0.2-alpha-prepared
          path: ${{ env.ALPHA_ROOT }}/assets/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-0.2-alpha-preparation-evidence
          path: ${{ env.ALPHA_ROOT }}/evidence/
          retention-days: 14
          if-no-files-found: error

  draft:
    needs: prepare
    if: github.repository == 'lust0yixiong/EarthNano' && github.ref == 'refs/heads/ci/earthnano-0.2-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: operation, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: application/.github/earthnano-node-version }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: earthnano-0.2-alpha-prepared
          path: ${{ env.ALPHA_ROOT }}/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: earthnano-0.2-alpha-preparation-evidence
          path: ${{ env.ALPHA_ROOT }}/evidence
      - name: Re-hash actual bytes, recheck gates/old releases/disabled publisher, create only exact versioned draft, verify all API digests by returned ID
        run: node "$ALPHA_OPERATION_ROOT/prepare-alpha-release.mjs" draft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-0.2-alpha-draft-evidence
          path: ${{ env.ALPHA_ROOT }}/evidence/
          retention-days: 14
          if-no-files-found: error
