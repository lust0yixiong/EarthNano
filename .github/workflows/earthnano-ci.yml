name: EarthNano 0.1.1 Alpha publication

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed and merged 0.1.1-alpha.1 application commit
        required: true
        type: string
      source_run_id:
        description: Successful same-source full Unix, Harness and packaged-trial CI run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: earthnano-0.1.1-alpha-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/ci/earthnano-0.1.1-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PATCH_SOURCE_ROOT: ${{ github.workspace }}/application
      PATCH_OPERATION_ROOT: ${{ github.workspace }}/operation/scripts/ci/patch-release
      PATCH_ROOT: ${{ github.workspace }}/patch-stage
      PATCH_SOURCE_SHA: ${{ inputs.source_sha }}
      PATCH_SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: operation, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: application/.github/earthnano-node-version }
      - name: Require successful original gates and preserve old releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node "$PATCH_OPERATION_ROOT/prepare-patch-release.mjs" gates
      - name: Original release helper dependencies only, without application lifecycle or rebuild
        working-directory: application
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: earthnano-unsigned-*
          path: ${{ env.PATCH_ROOT }}/inputs/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: earthnano-native-evidence-*
          path: ${{ env.PATCH_ROOT }}/inputs/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: earthnano-upstream-trials-packaged
          path: ${{ env.PATCH_ROOT }}/evidence/packaged-trials
      - name: Verify original source manifests and actual file bytes; collect without overwrite
        run: node "$PATCH_OPERATION_ROOT/prepare-patch-release.mjs" collect
      - name: Original four-target certification aggregate and Mac feed merge
        working-directory: application
        run: |
          node scripts/ci/release-certification-evidence.mjs aggregate \
            --directory "$PATCH_ROOT/assets" --output "$PATCH_ROOT/assets/RELEASE-CERTIFICATION.json" \
            --expected-sha "$PATCH_SOURCE_SHA" --platforms mac,linux
          node scripts/merge-mac-feed.mjs "$PATCH_ROOT/assets" --channel alpha
          (cd "$PATCH_ROOT/assets" && sha256sum --check --strict SHA256SUMS.txt)
      - name: Original complete Unix Alpha manifest, bound only to the new fixed version
        working-directory: application
        env:
          VERSION: 0.1.1-alpha.1
          UPDATE_CHANNEL: alpha
          ASSET_BASE_URL: https://github.com/lust0yixiong/EarthNano/releases/download/v0.1.1-alpha.1
          NOTES: |
            ## Highlights

            Two runnable upstream examples in the existing Project/Session workflow: OpenScience Case16 frozen-input reproduction and the Harness² signed-ledger task with explicit shared-core optimization. The requested About footer line is removed. Unsigned macOS/Linux Alpha preview; Windows remains deferred to 0.2-Alpha.
        run: |
          export RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/generate-version-manifest.mjs "$PATCH_ROOT/assets" "$PATCH_ROOT/assets/version.json" --require-complete --platforms mac,linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: earthnano-0.1.1-alpha-prepared
          path: ${{ env.PATCH_ROOT }}/assets/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-0.1.1-alpha-preparation-evidence
          path: ${{ env.PATCH_ROOT }}/evidence/
          retention-days: 14
          if-no-files-found: error

  draft:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: lust0yixiong/EarthNano
      PATCH_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: operation, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: earthnano-0.1.1-alpha-prepared
          path: assets
      - name: New version must not already exist
        shell: bash
        run: |
          set -euo pipefail
          for path in releases/tags/v0.1.1-alpha.1 git/ref/tags/v0.1.1-alpha.1; do
            set +e
            gh api --include "repos/$GH_REPO/$path" > probe.txt 2> probe-error.txt
            code=$?
            set -e
            test "$code" -ne 0
            head -1 probe.txt | grep -E '^HTTP/[0-9.]+ 404 '
          done
      - name: Create only a new versioned draft and upload validated bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets -maxdepth 1 -type f | wc -l)" -eq 28
          (cd assets && sha256sum --check --strict SHA256SUMS.txt)
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref=refs/tags/v0.1.1-alpha.1 -f sha="$PATCH_SOURCE_SHA"
          gh release create v0.1.1-alpha.1 --verify-tag --draft --prerelease --latest=false \
            --title 'EarthNano 0.1.1-Alpha — upstream trial examples' \
            --notes-file operation/scripts/ci/patch-release/release-notes.md
          gh release upload v0.1.1-alpha.1 assets/*
      - name: Retain and independently verify actual draft identity and every uploaded byte digest
        run: |
          gh api repos/lust0yixiong/EarthNano/releases/tags/v0.1.1-alpha.1 > draft.json
          gh api repos/lust0yixiong/EarthNano/git/ref/tags/v0.1.1-alpha.1 > tag.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {createHash} from 'node:crypto'
          import {createReadStream} from 'node:fs'
          import {readFile,readdir,stat,writeFile} from 'node:fs/promises'
          const release=JSON.parse(await readFile('draft.json','utf8'))
          const tag=JSON.parse(await readFile('tag.json','utf8'))
          assert.equal(release.tag_name,'v0.1.1-alpha.1')
          assert.equal(release.draft,true)
          assert.equal(release.prerelease,true)
          assert.equal(tag.object.sha,process.env.PATCH_SOURCE_SHA)
          const names=(await readdir('assets')).sort()
          assert.deepEqual(release.assets.map(a=>a.name).sort(),names)
          const files=[]
          for(const name of names){
            const hash=createHash('sha256')
            for await(const chunk of createReadStream('assets/'+name)) hash.update(chunk)
            const digest=hash.digest('hex'), size=(await stat('assets/'+name)).size
            const asset=release.assets.find(a=>a.name===name)
            assert.equal(asset.size,size)
            assert.equal(asset.digest,'sha256:'+digest)
            files.push({name,bytes:size,sha256:digest,assetId:asset.id})
          }
          await writeFile('prepared-file-digests.json',JSON.stringify({verified:true,source:process.env.PATCH_SOURCE_SHA,files},null,2)+'\n')
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: earthnano-0.1.1-alpha-draft-evidence
          path: |
            draft.json
            tag.json
            prepared-file-digests.json
            probe.txt
            probe-error.txt
          retention-days: 14
